specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: objcustody
    network: base-sepolia
    source:
      address: "0x725C1614Eb1c9E160E4B07d809D19205c1a5a669"
      abi: objcustody
      startBlock: 46740210
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Object
        - CustodyTransfer
      abis:
        - name: objcustody
          file: ./abis/objcustody.json
      eventHandlers:
        - event: ObjectRegistered(indexed bytes32,indexed address,string)
          handler: handleObjectRegistered
        - event: CustodyTransferred(indexed bytes32,indexed address,indexed address)
          handler: handleCustodyTransferred
      file: ./src/mapping.ts
      